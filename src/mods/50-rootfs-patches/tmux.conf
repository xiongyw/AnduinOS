# put this into .bashrc
# tmux a -t $LOGNAME || tmux new-session -s $LOGNAME


# Keybinds
set -g prefix C-a
bind C-a send-prefix
unbind C-b
set -sg escape-time 1
set -g base-index 1
set -g pane-base-index 1
bind r source-file ~/.tmux.conf \; display "Reloaded!"

## mouse support: before v2.1
#setw -g mode-mouse on
#setw -g mouse-select-pane on
#setw -g mouse-resize-pane on
#setw -g mouse-select-window on
## mose support: after v2.1
setw -g mouse on

bind-key C-a last-window
bind-key k confirm-before -p "kill-window #W? (y/n)" kill-window
unbind %
bind | split-window -h
bind - split-window -v

# 256 color terminal
#set -g default-terminal "tmux-256color"
#set -g default-command "env TERM=xterm-256color /bin/bash"

# Look n feel
#set -g status-bg blue 
#set -g status-fg white
set -g status-style bg=blue,fg=white
set -g status-right "#(id -un)@#(hostname) #[fg=green]%F %T"
set -g status-interval 1
#set -g status-utf8 on
set -g set-titles on
#set-window-option -g window-status-current-format ' #[fg=white,bold]*#[fg=white,bold][#{window_index}] #[fg=green]#{pane_current_command} '
#set-window-option -g window-status-format '#[fg=colour244,bold][#{window_index}] #[fg=colour244]#{pane_current_command} '
# highlight active window
#set-window-option -g window-status-current-bg red
set-window-option -g window-status-current-style bg=red
# scroll with shift-up-down
set -g terminal-overrides 'xterm*:smcup@:rmcup@'
# Set window notifications
setw -g monitor-activity on
set -g visual-activity on
# set scroll back to 10000 lines
set -g history-limit 10000
# disable visual activity reporting
set -g visual-activity on
#set -g visual-content on
set -g base-index 1
setw -g mode-keys vi
#set -g pane-active-border-bg green
set -g pane-active-border-style bg=green

set-option -g default-shell ${SHELL}

bind-key b select-pane -t 2 \; send-keys Up C-m \; last-pane
